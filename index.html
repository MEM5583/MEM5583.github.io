<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TM_MEM - Bio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 119, 255, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: pulse 4s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 162, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: pulse 5s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 119, 255, 0.3), 0 0 40px rgba(0, 162, 255, 0.2); }
            50% { box-shadow: 0 0 30px rgba(0, 119, 255, 0.5), 0 0 60px rgba(0, 162, 255, 0.3); }
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            animation: slideIn 0.6s ease-out;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0077ff 0%, #00a2ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 24px rgba(0, 119, 255, 0.4);
            position: relative;
            animation: glow 3s ease-in-out infinite;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, #0077ff, #00a2ff, #0077ff);
            z-index: -1;
            opacity: 0.5;
            filter: blur(10px);
        }

        .username {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .description {
            text-align: center;
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            background: rgba(0, 119, 255, 0.08);
            border: 1px solid rgba(0, 119, 255, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 119, 255, 0.15), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            background: rgba(0, 119, 255, 0.15);
            border-color: rgba(0, 119, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 119, 255, 0.3);
        }

        .link-icon {
            width: 24px;
            height: 24px;
            fill: #0077ff;
            flex-shrink: 0;
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .link-subtitle {
            font-size: 13px;
            color: #808080;
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            color: #606060;
            font-size: 13px;
        }

        .footer a {
            color: #0077ff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #00a2ff;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .username {
                font-size: 28px;
            }

            .avatar {
                width: 100px;
                height: 100px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar-wrapper">
            <div class="avatar">

        </div>

        <h1 class="username">TM_MEM</h1>
        <p class="description">Russian Programmer</p>

            <a class="link-item" href="https://www.roblox.com/users/394607765/profile?friendshipSourceType=PlayerSearch" target="_blank">

        <div class="footer">
            Made with 💙 by TM_MEM
        </div>
    </div>

    <script>
        function copyDiscord() {
            const discordTag = 'mem5583';
            navigator.clipboard.writeText(discordTag).then(() => {
                const originalText = event.currentTarget.querySelector('.link-subtitle').textContent;
                event.currentTarget.querySelector('.link-subtitle').textContent = 'Copied!';
                setTimeout(() => {
                    event.currentTarget.querySelector('.link-subtitle').textContent = originalText;
                }, 2000);
            }).catch(err => {
                alert('Discord: ' + discordTag);
            });
        }

        document.querySelectorAll('.link-item').forEach((item, index) => {
            item.style.animation = `slideIn 0.6s ease-out ${0.1 + index * 0.1}s backwards`;
        });
    </script>
</body>
</html>
